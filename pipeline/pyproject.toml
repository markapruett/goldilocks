[project]
name = "goldilocks-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cdsapi>=0.7.7",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "pyshp>=3.1.6",
    "shapely>=2.2.0",
    "xarray>=2026.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
